<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13263b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="巴黎手帐">
  <meta name="description" content="2026.12.7–14 巴黎 8 天 7 晚私人行程手帐 · 可离线打开 · 景点定位 · 预约清单">
  <meta property="og:title" content="巴黎手帐 · Paris Pocket">
  <meta property="og:description" content="我们的巴黎 8 天 7 晚行程">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" sizes="192x192" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>巴黎手帐 · Paris Pocket</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="site-header">
      <div class="brand-mark" aria-hidden="true">P<span>·</span></div>
      <div class="brand-copy">
        <span class="brand-eyebrow">OUR LITTLE PARIS JOURNAL</span>
        <strong>巴黎手帐 <span class="brand-light">/ Paris Pocket</span></strong>
      </div>
      <button class="icon-button header-info" id="help-btn" aria-label="添加至主屏幕说明" title="添加至主屏幕">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4m0-4h.01"/></svg>
      </button>
    </header>

    <main id="main-content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="主要导航">
      <button class="nav-item active" data-tab="days" aria-label="行程" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/><path d="m8 15 2.5 2.5L16 13"/></svg><span>行程</span>
      </button>
      <button class="nav-item" data-tab="map" aria-label="地图">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6ZM9 3v15M15 6v15"/></svg><span>地图</span>
      </button>
      <button class="nav-item" data-tab="bookings" aria-label="预约清单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 12 2.5 2.5L16 9"/></svg><span>预约</span>
      </button>
      <button class="nav-item" data-tab="more" aria-label="旅行信息">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18h.01M12 12h.01M12 6h.01" stroke-width="3"/></svg><span>旅行卡片</span>
      </button>
    </nav>
  </div>
  <dialog class="modal" id="install-dialog" aria-labelledby="install-title">
    <div class="modal-head"><span class="modal-mini">SAVE YOUR PARIS</span><button class="icon-button" id="close-dialog" aria-label="关闭">×</button></div>
    <h2 id="install-title">放进 iPhone 主屏幕</h2>
    <p>网页发布到 HTTPS 地址后，用 iPhone 的 <strong>Safari</strong> 打开：</p>
    <ol class="install-steps">
      <li>点击底部<strong>分享</strong>按钮（方框向上箭头）</li>
      <li>向下滑动，选择<strong>添加到主屏幕</strong></li>
      <li>名称设为「巴黎手帐」，如果出现「以 Web App 方式打开」选项请打开，再点击<strong>添加</strong></li>
    </ol>
    <p class="muted">之后可从主屏幕像 App 一样打开。行程文字支持离线阅读，互动地图需要网络。后续更新同一网址即可，不必重新添加图标。</p>
    <button id="dialog-done" class="primary-btn full">知道了</button>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./trip-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
