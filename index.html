<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff0d8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="巴黎手帐">
  <meta name="description" content="巴黎 8 天 7 晚旅行手帐 · 离线行程 · Google Maps 导航 · 本机备注与待办">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" sizes="192x192" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>巴黎手帐 · Paris Pocket</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="site-header">
      <div class="brand-mark" aria-hidden="true">P<span>·</span></div>
      <div class="brand-copy"><span class="brand-eyebrow">OUR LITTLE PARIS JOURNAL</span><strong>巴黎手帐 <span class="brand-light">/ Paris Pocket</span></strong></div>
      <button class="icon-button header-info" id="help-btn" aria-label="添加至主屏幕说明">?</button>
    </header>
    <p id="storage-warning" class="storage-warning" role="alert" hidden></p>
    <button id="reload-data" class="secondary-btn full" hidden>重新读取本机资料（保留未保存草稿）</button>
    <button id="app-update" class="update-banner" hidden>新 App 版本已准备好 · 点击更新</button>
    <main id="main-content" tabindex="-1"><p class="empty-day">正在打开巴黎手帐…</p></main>
    <nav class="bottom-nav" aria-label="主要导航">
      <button class="nav-item active" data-tab="days" aria-label="行程" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15l2.5 2.5L16 13"/></svg><span>行程</span></button>
      <button class="nav-item" data-tab="map" aria-label="地图"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6ZM9 3v15M15 6v15"/></svg><span>地图</span></button>
      <button class="nav-item" data-tab="todo" aria-label="待办"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 12 2.5 2.5L16 9"/></svg><span>待办</span></button>
      <button class="nav-item" data-tab="more" aria-label="旅行卡片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18h.01M12 12h.01M12 6h.01" stroke-width="3"/></svg><span>旅行卡片</span></button>
    </nav>
  </div>
  <dialog id="activity-detail-dialog" class="modal detail-modal" aria-labelledby="detail-title"><div class="detail-header"><span class="detail-kicker">ACTIVITY DETAILS</span><button id="activity-detail-close" class="icon-button" aria-label="关闭活动详情">×</button></div><div id="activity-detail-content"></div></dialog>
  <dialog id="task-dialog" class="modal activity-modal" aria-labelledby="task-title"><form id="task-form"></form></dialog>
  <dialog id="backup-dialog" class="modal" aria-labelledby="backup-title"><h2 id="backup-title">导入备份预览</h2><div id="backup-preview"></div><div class="btn-row"><button class="secondary-btn" id="backup-cancel">取消</button><button class="primary-btn" id="backup-confirm">确认导入</button></div><p id="backup-error" role="alert"></p></dialog>
  <dialog id="install-dialog" class="modal" aria-labelledby="install-title"><div class="modal-head"><span class="modal-mini">SAVE YOUR PARIS</span><button class="icon-button" id="close-dialog" aria-label="关闭安装说明">×</button></div><h2 id="install-title">放进 iPhone 主屏幕</h2><p>用 Safari 打开此网址，点击「分享」→「添加到主屏幕」。继续使用同一个网址和图标。</p><p>行程、任务、备注可离线阅读。完整底图和 Google Maps 导航需要网络；本机个人资料不会自动同步到另一台手机。</p><button class="primary-btn full" id="dialog-done">知道了</button></dialog>
  <input id="backup-file" type="file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./trip-data.js"></script>
  <script src="./personal-data.js"></script>
  <script src="./itinerary-data.js"></script>
  <script src="./official-data.js"></script>
  <script src="./trip/bootstrap.js"></script>
  <script src="./local-store.js"></script>
  <script src="./map-links.js"></script>
  <script src="./views.js"></script>
  <script src="./app.js"></script>
</body>
</html>
